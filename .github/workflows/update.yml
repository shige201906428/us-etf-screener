name: Daily ETF Screener Update

on:
  schedule:
    # 毎日 UTC 21:00（日本時間 午前6:00）に実行
    - cron: '0 21 * * *'
  workflow_dispatch: # 手動実行ボタンも有効化

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas

    - name: Run Python script
        # ここでスクリプトを実行し、index.html を上書きします
      run: python generate_screener.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add index.html
        git diff-index --quiet HEAD || (git commit -m "Auto-update ETF data" && git push)
